vulnerabilities:
  - id: CVE-2026-41417
    statement: "Netty request-line validation bypass via setUri() enables CRLF injection/request smuggling. Low risk for ADOT Java agent (URIs are operator-configured, no attacker-controlled input reaches setUri()). Fix: bump netty-bom to 4.1.133.Final. https://nvd.nist.gov/vuln/detail/CVE-2026-41417"
    expired_at: 2026-05-22
  - id: CVE-2026-42583
    statement: "Netty Lz4FrameDecoder resource exhaustion. Fix: bump netty-bom to 4.1.133.Final. https://avd.aquasec.com/nvd/cve-2026-42583"
    expired_at: 2026-05-22
  - id: CVE-2026-42584
    statement: "Netty HttpClientCodec response desynchronization. Fix: bump netty-bom to 4.1.133.Final. https://avd.aquasec.com/nvd/cve-2026-42584"
    expired_at: 2026-05-22
  - id: CVE-2026-42587
    statement: "Netty HttpContentDecompressor maxAllocation bypass with br/zstd/snappy Content-Encoding leads to decompression bomb. Fix: bump netty-bom to 4.1.133.Final. https://avd.aquasec.com/nvd/cve-2026-42587"
    expired_at: 2026-05-22
  - id: GHSA-r7wm-3cxj-wff9
    statement: "jackson-core async (non-blocking) parser maxNumberLength/StreamReadConstraints bypass via chunked digit accumulation (DoS hardening). Low risk for ADOT Java agent: jackson parses only trusted operator-provided config, not attacker-controlled JSON via the async parser. Bundled by upstream OTel javaagent 2.26.1 as jackson-core 2.22.0. Fix: pick up upstream OTel release bundling jackson 2.22.1. https://github.com/advisories/GHSA-r7wm-3cxj-wff9"
    expired_at: 2026-08-28
  - id: CVE-2026-59889
    statement: "jackson-databind @JsonView bypassed for @JsonUnwrapped container properties on deserialization. Low risk for ADOT Java agent: no untrusted deserialization using @JsonView as a security boundary. Bundled by upstream OTel javaagent 2.26.1 as jackson-databind 2.22.0. Fix: pick up upstream OTel release bundling jackson 2.22.1. https://avd.aquasec.com/nvd/cve-2026-59889"
    expired_at: 2026-08-28
